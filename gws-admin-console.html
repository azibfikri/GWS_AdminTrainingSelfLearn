<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin console</title>
  <link rel="icon" href="./favicon.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Google+Sans:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f8f9fa;
      --surface: #ffffff;
      --ink: #202124;
      --muted: #5f6368;
      --line: #dadce0;
      --nav: #f1f3f4;
      --nav-hover: #e8eaed;
      --nav-active: #e8f0fe;
      --blue: #1a73e8;
      --blue-dark: #174ea6;
      --green: #188038;
      --green-bg: #e6f4ea;
      --amber: #ea8600;
      --amber-bg: #fef7e0;
      --red: #d93025;
      --red-bg: #fce8e6;
      --sidebar-w: 260px;
      --coach-w: 340px;
      --top-h: 56px;
      --radius: 8px;
      --shadow: 0 1px 2px rgba(60,64,67,.3), 0 1px 3px 1px rgba(60,64,67,.15);
      --font: "Roboto", system-ui, sans-serif;
      --display: "Google Sans", "Roboto", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: var(--font);
      color: var(--ink);
      background: var(--bg);
      line-height: 1.45;
    }
    button, input, select, textarea { font: inherit; }
    a { color: var(--blue); }
    .banner {
      background: #e8f0fe; border-bottom: 1px solid #c2d7fc; color: #174ea6;
      padding: .55rem 1rem; font-size: .85rem; text-align: center;
    }
    .banner strong { color: #174ea6; }
    body.lab-mode .banner { background: #e6f4ea; border-bottom-color: #a8dab5; color: #0d652d; }
    body.lab-mode .banner strong { color: #0d652d; }
    .topbar {
      height: var(--top-h); background: var(--surface); border-bottom: 1px solid var(--line);
      display: flex; align-items: center; gap: .75rem; padding: 0 1rem; position: sticky; top: 0; z-index: 20;
    }
    .logo {
      font-family: var(--display); font-weight: 700; font-size: 1.05rem; color: var(--ink);
      display: flex; align-items: center; gap: .5rem; text-decoration: none;
    }
    .logo .mark {
      width: 28px; height: 28px; border-radius: 6px; background: linear-gradient(135deg, #4285f4, #34a853);
      display: grid; place-items: center; color: #fff; font-size: .75rem; font-weight: 700;
    }
    .top-spacer { flex: 1; }
    .chip {
      display: inline-flex; align-items: center; gap: .35rem; padding: .25rem .55rem;
      border-radius: 999px; background: var(--nav); border: 1px solid var(--line); font-size: .78rem; font-weight: 500;
    }
    .chip.blue { background: var(--nav-active); border-color: #c2d7fc; color: var(--blue-dark); }
    .btn {
      border: 1px solid var(--line); background: var(--surface); color: var(--ink);
      border-radius: 4px; padding: .45rem .85rem; cursor: pointer; font-weight: 500; font-size: .875rem;
    }
    .btn:hover { background: var(--nav); }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
    .btn.primary:hover { background: var(--blue-dark); }
    .btn.danger { background: var(--red); border-color: var(--red); color: #fff; }
    .btn.ghost { background: transparent; }
    .layout { display: grid; grid-template-columns: var(--sidebar-w) 1fr; min-height: calc(100vh - var(--top-h) - 40px); }
    .sidebar {
      background: var(--nav); border-right: 1px solid var(--line); padding: .75rem 0 2rem; overflow: auto;
    }
    .nav-sec {
      margin: .85rem 1rem .25rem; font-size: .68rem; font-weight: 700; letter-spacing: .06em;
      text-transform: uppercase; color: var(--muted);
    }
    .nav-item {
      display: block; width: 100%; text-align: left; border: 0; background: transparent;
      padding: .55rem 1rem .55rem 1.15rem; cursor: pointer; color: var(--ink); font-size: .9rem;
      border-left: 3px solid transparent;
    }
    .nav-item:hover { background: var(--nav-hover); }
    .nav-item.active { background: var(--nav-active); border-left-color: var(--blue); color: var(--blue-dark); font-weight: 500; }
    .nav-item .sub { display: block; font-size: .75rem; color: var(--muted); font-weight: 400; margin-top: .1rem; }
    .main { padding: 1.25rem 1.5rem 3rem; overflow: auto; }
    .panel { display: none; }
    .panel.active { display: block; }
    .panel h1 {
      font-family: var(--display); font-size: 1.55rem; font-weight: 700; margin: 0 0 .35rem;
    }
    .lede { color: var(--muted); margin: 0 0 1rem; max-width: 70ch; }
    .card {
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 1rem 1.1rem; margin-bottom: 1rem; box-shadow: 0 1px 2px rgba(60,64,67,.08);
    }
    .card h2 { font-size: 1rem; margin: 0 0 .65rem; font-weight: 500; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .grid-3 { display: grid; grid-template-columns: 1.1fr 1fr 1fr; gap: 1rem; }
    .tip {
      background: #e8f0fe; border: 1px solid #c2d7fc; border-radius: var(--radius);
      padding: .75rem .9rem; font-size: .88rem; margin: .75rem 0;
    }
    .warn {
      background: var(--amber-bg); border: 1px solid #f9e3a0; border-radius: var(--radius);
      padding: .75rem .9rem; font-size: .88rem; margin: .75rem 0;
    }
    .danger-box {
      background: var(--red-bg); border: 1px solid #f6aea9; border-radius: var(--radius);
      padding: .75rem .9rem; font-size: .88rem; margin: .75rem 0;
    }
    .ok-box {
      background: var(--green-bg); border: 1px solid #a8dab5; border-radius: var(--radius);
      padding: .75rem .9rem; font-size: .88rem; margin: .75rem 0;
    }
    .field { margin: .55rem 0; }
    .field label { display: block; font-size: .78rem; font-weight: 500; color: var(--muted); margin-bottom: .25rem; }
    .field input, .field select, .field textarea {
      width: 100%; padding: .55rem .65rem; border: 1px solid var(--line); border-radius: 4px; background: #fff;
    }
    .field textarea { min-height: 90px; resize: vertical; }
    .row { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; margin: .5rem 0; }
    .badge {
      display: inline-flex; align-items: center; padding: .15rem .45rem; border-radius: 4px;
      font-size: .72rem; font-weight: 700; letter-spacing: .02em; text-transform: uppercase;
    }
    .badge.inherited { background: #e8f0fe; color: var(--blue-dark); }
    .badge.override { background: var(--amber-bg); color: #b06000; }
    .badge.hold { background: var(--green-bg); color: var(--green); }
    .badge.suspended { background: var(--amber-bg); color: #b06000; }
    .badge.deleted { background: var(--red-bg); color: var(--red); }
    .badge.aul { background: #e8eaed; color: #3c4043; }
    .badge.group { background: #f3e8fd; color: #7627bb; }
    .ou-tree { list-style: none; margin: 0; padding: 0; }
    .ou-tree ul { list-style: none; margin: 0; padding-left: 1.1rem; border-left: 1px solid var(--line); }
    .ou-node {
      display: flex; align-items: center; gap: .4rem; padding: .35rem .45rem; border-radius: 4px;
      cursor: pointer; margin: 2px 0;
    }
    .ou-node:hover { background: var(--nav); }
    .ou-node.selected { background: var(--nav-active); }
    .user-table { width: 100%; border-collapse: collapse; font-size: .88rem; }
    .user-table th, .user-table td { text-align: left; padding: .55rem .45rem; border-bottom: 1px solid var(--line); vertical-align: top; }
    .user-table th { font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
    .log {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .8rem;
      background: #202124; color: #e8eaed; border-radius: 6px; padding: .75rem .9rem;
      max-height: 260px; overflow: auto; white-space: pre-wrap;
    }
    .log .add { color: #81c995; }
    .log .upd { color: #8ab4f8; }
    .log .skip { color: #fdd663; }
    .log .del { color: #f28b82; }
    .steps { counter-reset: step; list-style: none; padding: 0; margin: 0; }
    .steps li {
      position: relative; padding: .75rem .75rem .75rem 2.6rem; margin: .4rem 0;
      border: 1px solid var(--line); border-radius: var(--radius); background: #fff;
    }
    .steps li::before {
      counter-increment: step; content: counter(step);
      position: absolute; left: .65rem; top: .75rem; width: 1.4rem; height: 1.4rem;
      border-radius: 50%; background: var(--blue); color: #fff; font-size: .75rem; font-weight: 700;
      display: grid; place-items: center;
    }
    .steps li.done { border-color: #a8dab5; background: var(--green-bg); }
    .steps li.locked { opacity: .55; }
    .toast {
      position: fixed; bottom: 1.25rem; left: 50%; transform: translateX(-50%) translateY(120%);
      background: #323232; color: #fff; padding: .7rem 1.1rem; border-radius: 4px; z-index: 50;
      font-size: .88rem; transition: transform .25s ease; max-width: 90vw; text-align: center;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .lab-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: .85rem; }
    .lab-card {
      text-align: left; border: 1px solid var(--line); background: #fff; border-radius: 10px;
      padding: 1rem 1.05rem; cursor: pointer; display: flex; flex-direction: column; gap: .35rem;
      min-height: 168px;
    }
    .lab-card:hover { border-color: var(--blue); box-shadow: var(--shadow); }
    .lab-card.done { border-color: #a8dab5; background: #f7fbf8; }
    .lab-card h3 { margin: 0; font-size: 1rem; font-family: var(--display); }
    .lab-card p { margin: 0; color: var(--muted); font-size: .84rem; flex: 1; }
    .lab-card-meta { display: flex; flex-wrap: wrap; gap: .35rem; align-items: center; }
    .lab-id { font-size: .72rem; font-weight: 700; letter-spacing: .04em; color: var(--blue-dark); }
    .lab-hero {
      background: linear-gradient(135deg, #e8f0fe 0%, #fff 55%, #e6f4ea 100%);
      border: 1px solid var(--line); border-radius: 12px; padding: 1.15rem 1.2rem; margin-bottom: 1.1rem;
    }
    .lab-hero h1 { margin: 0 0 .35rem; }
    .lab-mod-sec {
      margin: 1.35rem 0 .55rem; font-family: var(--display); font-size: 1.05rem;
    }
    .lab-mod-sec a { font-size: .8rem; font-weight: 500; margin-left: .45rem; }
    .lab-scenario {
      background: #fff8e8; border: 1px solid #f9e3a0; border-radius: 8px;
      padding: .65rem .75rem; font-size: .84rem; margin: .5rem 0 .65rem; line-height: 1.45;
    }
    .lab-scenario strong {
      display: block; font-size: .68rem; text-transform: uppercase; letter-spacing: .04em;
      color: #b06000; margin: .35rem 0 .15rem;
    }
    .lab-scenario strong:first-child { margin-top: 0; }
    .lab-obj { margin: .35rem 0 .65rem; padding-left: 1.1rem; font-size: .82rem; color: var(--muted); }
    .lab-from-desk {
      background: #e8f0fe; border: 1px solid #c5d7f7; border-radius: 8px;
      padding: .6rem .7rem; font-size: .8rem; line-height: 1.45; margin: .35rem 0 .55rem;
    }
    .lab-from-desk em { display: block; font-style: normal; font-size: .66rem; letter-spacing: .04em;
      text-transform: uppercase; color: var(--blue-dark); font-weight: 700; margin-bottom: .25rem; }
    .lab-reads { display: flex; flex-wrap: wrap; gap: .3rem; margin: .25rem 0 .55rem; }
    .lab-reads a {
      font-size: .72rem; padding: .15rem .4rem; border-radius: 999px;
      background: #f1f3f4; color: var(--blue-dark); text-decoration: none; border: 1px solid var(--line);
    }
    .lab-reads a:hover { border-color: var(--blue); background: #e8f0fe; }
    .lab-card .lab-sec { font-size: .72rem; color: var(--blue-dark); }
    .lab-task-body { flex: 1; min-width: 0; }
    .lab-task .btn { margin-top: .35rem; font-size: .75rem; padding: .25rem .5rem; }
    .lab-live {
      display: none; align-items: center; gap: .45rem;
      padding: .2rem .55rem .2rem .65rem; border-radius: 999px;
      background: #e6f4ea; border: 1px solid #a8dab5; font-size: .78rem; font-weight: 500;
    }
    body.lab-mode .lab-live { display: inline-flex; }
    .lab-task { display: flex; gap: .55rem; align-items: flex-start; padding: .45rem 0; border-bottom: 1px dashed var(--line); font-size: .85rem; }
    .lab-task .mark { flex: 0 0 18px; width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line); margin-top: .1rem; }
    .lab-task.pass .mark { background: var(--green); border-color: var(--green); }
    .lab-task.fail .mark { background: transparent; }
    .scenario-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: .75rem; }
    .scenario-card {
      border: 1px solid var(--line); border-radius: var(--radius); padding: 1rem; background: #fff; cursor: pointer; text-align: left;
    }
    .scenario-card:hover { border-color: var(--blue); box-shadow: var(--shadow); }
    .scenario-card h3 { margin: 0 0 .35rem; font-size: 1rem; }
    .scenario-card p { margin: 0; color: var(--muted); font-size: .85rem; }
    .eff-box {
      border: 1px dashed var(--line); border-radius: var(--radius); padding: .85rem; background: #fafafa;
    }
    .eff-box .line { margin: .35rem 0; font-size: .9rem; }
    .muted { color: var(--muted); font-size: .85rem; }
    .hidden { display: none !important; }
    
    body.coach-open .layout { grid-template-columns: var(--sidebar-w) 1fr var(--coach-w); }
    body.coach-open .main { padding-right: 1.25rem; }
    .coach {
      display: none; background: var(--surface); border-left: 1px solid var(--line);
      padding: .85rem .9rem 1.5rem; overflow: auto; position: sticky; top: var(--top-h);
      height: calc(100vh - var(--top-h) - 40px); z-index: 15;
    }
    body.coach-open .coach { display: block; }
    .coach h2 { font-family: var(--display); font-size: 1.05rem; margin: 0 0 .35rem; }
    .coach-progress { height: 6px; background: var(--nav); border-radius: 99px; overflow: hidden; margin: .45rem 0 .75rem; }
    .coach-progress > i { display: block; height: 100%; background: var(--blue); width: 0%; }
    .coach-meta { font-size: .78rem; color: var(--muted); margin-bottom: .5rem; }
    .coach-title { font-size: 1rem; font-weight: 700; margin: .35rem 0; }
    .coach-body { font-size: .88rem; color: var(--ink); margin: 0 0 .65rem; }
    .coach-do { background: #e8f0fe; border: 1px solid #c2d7fc; border-radius: var(--radius); padding: .65rem .75rem; font-size: .85rem; margin: .5rem 0; }
    .coach-do strong { display: block; margin-bottom: .25rem; color: var(--blue-dark); font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; }
    .coach-why { font-size: .82rem; color: var(--muted); margin: .5rem 0 .75rem; }
    .coach-actions { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .75rem; }
    .coach-fab {
      display: none; position: fixed; right: 1rem; bottom: 1rem; z-index: 18;
      background: var(--blue); color: #fff; border: 0; border-radius: 999px;
      padding: .65rem 1rem; font-weight: 500; cursor: pointer; box-shadow: var(--shadow);
    }
    body.coach-minimized .coach-fab { display: inline-flex; }
    body.coach-minimized.coach-open .coach { display: none; }
    body.coach-minimized.coach-open .layout { grid-template-columns: var(--sidebar-w) 1fr; }
    .sr-live { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }
    @media (max-width: 1100px) {
      body.coach-open .layout { grid-template-columns: var(--sidebar-w) 1fr; }
      body.coach-open .coach {
        position: fixed; left: 0; right: 0; bottom: 0; top: auto; height: 42vh;
        border-left: 0; border-top: 1px solid var(--line); z-index: 25;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .coach-progress > i { transition: none; }
    }

    
    .tabs { display: flex; flex-wrap: wrap; gap: .25rem; border-bottom: 1px solid var(--line); margin: 0 0 1rem; }
    .tab {
      border: 0; background: transparent; padding: .65rem .9rem; cursor: pointer; font-weight: 500;
      color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px;
    }
    .tab.active { color: var(--blue); border-bottom-color: var(--blue); }
    .status-pill {
      display: inline-flex; align-items: center; gap: .3rem; padding: .2rem .5rem; border-radius: 999px;
      font-size: .72rem; font-weight: 700; text-transform: uppercase;
    }
    .status-pill.ok { background: var(--green-bg); color: var(--green); }
    .status-pill.warn { background: var(--amber-bg); color: #b06000; }
    .status-pill.bad { background: var(--red-bg); color: var(--red); }
    .status-pill.muted { background: var(--nav); color: var(--muted); }
    .dns-table { width: 100%; border-collapse: collapse; font-size: .82rem; margin: .5rem 0; }
    .dns-table th, .dns-table td { text-align: left; padding: .5rem .4rem; border-bottom: 1px solid var(--line); vertical-align: top; font-family: ui-monospace, Menlo, monospace; }
    .dns-table th { font-family: var(--font); font-size: .7rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
    .checklist { list-style: none; padding: 0; margin: .5rem 0; }
    .checklist li { padding: .45rem 0; border-bottom: 1px dashed var(--line); display: flex; gap: .5rem; align-items: flex-start; }
    .breadcrumb { font-size: .8rem; color: var(--muted); margin: 0 0 .75rem; }
    .codebox {
      background: #f1f3f4; border: 1px solid var(--line); border-radius: 4px; padding: .55rem .65rem;
      font-family: ui-monospace, Menlo, monospace; font-size: .78rem; word-break: break-all; margin: .35rem 0 .65rem;
    }

    @media (max-width: 980px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar { border-right: 0; border-bottom: 1px solid var(--line); max-height: 220px; }
      .grid-2, .grid-3, .scenario-grid, .lab-grid { grid-template-columns: 1fr; }
    }

    /* —— Google Admin console chrome —— */
    :root {
      --sidebar-w: 280px;
      --top-h: 64px;
      --g-blue: #1a73e8;
      --g-header: #fff;
    }
    body { background: #f8f9fa; }
    .banner {
      background: #fef7e0; border-bottom: 1px solid #f9e3a0; color: #3c4043;
      padding: .4rem 1rem; font-size: .78rem; text-align: left;
      display: flex; flex-wrap: wrap; gap: .5rem 1rem; align-items: center;
    }
    .banner strong { color: #3c4043; }
    body.lab-mode .banner { background: #e6f4ea; border-bottom-color: #a8dab5; color: #0d652d; }
    .topbar {
      height: 64px; padding: 0 .75rem 0 .35rem; gap: .35rem;
      box-shadow: 0 1px 2px rgba(60,64,67,.15);
    }
    .hamburger {
      width: 48px; height: 48px; border: 0; background: transparent; border-radius: 50%;
      cursor: pointer; color: #5f6368; display: grid; place-items: center;
    }
    .hamburger:hover { background: #f1f3f4; }
    .g-logo { display: flex; align-items: center; gap: .45rem; text-decoration: none; color: #5f6368; padding: 0 .4rem 0 .15rem; }
    .g-logo svg { width: 32px; height: 32px; display: block; }
    .g-logo .word { font-family: var(--display); font-size: 1.35rem; font-weight: 500; letter-spacing: -.02em; color: #5f6368; }
    .admin-search-wrap { flex: 1; max-width: 720px; margin: 0 auto; position: relative; }
    .admin-search {
      width: 100%; height: 48px; border: 0; border-radius: 8px; background: #f1f3f4;
      padding: 0 1rem 0 3rem; font-size: 1rem; color: #202124;
    }
    .admin-search:focus { outline: none; background: #fff; box-shadow: 0 1px 2px rgba(60,64,67,.3), 0 2px 6px 2px rgba(60,64,67,.15); }
    .admin-search-ico {
      position: absolute; left: .9rem; top: 50%; transform: translateY(-50%); color: #5f6368; pointer-events: none;
    }
    .search-pop {
      display: none; position: absolute; left: 0; right: 0; top: calc(100% + 4px);
      background: #fff; border-radius: 8px; box-shadow: var(--shadow); z-index: 40;
      max-height: 420px; overflow: auto; padding: .35rem 0;
    }
    .search-pop.open { display: block; }
    .search-chip-row { display: flex; gap: .35rem; padding: .4rem .75rem .55rem; }
    .search-chip {
      border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: .2rem .65rem;
      font-size: .78rem; cursor: pointer; color: #3c4043;
    }
    .search-chip.on { background: #e8f0fe; border-color: #c2d7fc; color: #1967d2; }
    .search-hit {
      display: flex; gap: .65rem; align-items: center; width: 100%; border: 0; background: transparent;
      text-align: left; padding: .55rem .9rem; cursor: pointer; font-size: .9rem;
    }
    .search-hit:hover { background: #f1f3f4; }
    .search-hit small { display: block; color: var(--muted); font-size: .75rem; }
    .top-ico {
      width: 40px; height: 40px; border: 0; background: transparent; border-radius: 50%;
      cursor: pointer; color: #5f6368; display: grid; place-items: center;
    }
    .top-ico:hover { background: #f1f3f4; }
    .avatar-btn {
      width: 32px; height: 32px; border-radius: 50%; border: 0; background: #1a73e8; color: #fff;
      font-weight: 700; font-size: .8rem; cursor: pointer; margin: 0 .35rem;

        if (!data || data.version !== 1 || !Array.isArray(data.ous) || !Array.isArray(data.users)) {
          toast("Saved sandbox was invalid — reset to seed.");
          return seedState();
        }
        return data;
      } catch (e) {
        try { simStore.removeItem(STORAGE_KEY); } catch (e2) {}
        toast("Corrupt sandbox data cleared.");
        return seedState();
      }
    }

    function el(tag, props, kids) {
      const n = document.createElement(tag);
      if (props) {
        Object.keys(props).forEach((k) => {
          if (k === "className") n.className = props[k];
          else if (k === "text") n.textContent = props[k];
          else if (k === "html") { /* forbidden */ }
          else if (k.startsWith("on") && typeof props[k] === "function") n.addEventListener(k.slice(2).toLowerCase(), props[k]);
          else if (k === "disabled") n.disabled = !!props[k];
          else if (props[k] != null) n.setAttribute(k, props[k]);
        });
      }
      (kids || []).forEach((c) => {
        if (c == null) return;
        n.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
      });
      return n;
    }

    function audit(action, target) {
      state.auditLog.unshift({
        ts: Date.now(),

    function ouById(id) { return state.ous.find((o) => o.id === id); }
    function userById(id) { return state.users.find((u) => u.id === id); }
    function childrenOf(id) { return state.ous.filter((o) => o.parentId === id); }

    function ancestors(ouId) {
      const chain = [];
      let cur = ouById(ouId);
      const seen = new Set();
      while (cur) {
        if (seen.has(cur.id)) break;
        seen.add(cur.id);
        chain.push(cur);
        cur = cur.parentId ? ouById(cur.parentId) : null;
      }
      return chain;
    }

    function wouldCreateCycle(ouId, newParentId) {
      if (!newParentId) return false;
      if (ouId === newParentId) return true;
      return ancestors(newParentId).some((a) => a.id === ouId);
    }

    /** Resolve OU setting: nearest local value walking to root */
    function resolveOuSetting(key, ouId) {
      const map = state.settings[key] || {};
      for (const ou of ancestors(ouId)) {
        const local = map[ou.id];
        if (local && local.value != null) {
          return {
            value: local.value,
            sourceOuId: ou.id,
            sourceName: ou.name,
            mode: ou.id === ouId ? "OVERRIDDEN" : "INHERITED"
          };
        }
      }
      return { value: "UNSET", sourceOuId: null, sourceName: null, mode: "UNSET" };
    }

    /** Effective for a user: OU path then group overlay (group wins when enabled) */
    function resolveUserSetting(key, userId) {
      const user = userById(userId);
      if (!user) return null;
      const ouEff = resolveOuSetting(key, user.ouId);
      const groupMap = (state.groupOverrides[key] || {});
      let groupWin = null;
      (user.groups || []).forEach((gid) => {
        const g = groupMap[gid];
        if (g && g.enabled && g.value != null) {
          const gMeta = state.groups.find((x) => x.id === gid);
          groupWin = { value: g.value, groupId: gid, groupName: gMeta ? gMeta.name : gid };
        }
      });
      if (groupWin) {
        return {
          value: groupWin.value,
          mode: "GROUP",
          ouEff: ouEff,
          group: groupWin
        };
      }
      return { value: ouEff.value, mode: ouEff.mode, ouEff: ouEff, group: null };
    }

    function setOuSetting(key, ouId, valueOrNull) {
      if (!state.settings[key]) state.settings[key] = {};
      if (valueOrNull == null) state.settings[key][ouId] = null;
      else state.settings[key][ouId] = { value: valueOrNull };
      audit("Setting changed: " + key + " = " + (valueOrNull == null ? "INHERIT" : valueOrNull), ouById(ouId).name);
      saveState();
      render();
    }

    function visibleUsers() {
      const q = (state.ui.userQuery || "").toLowerCase();
      const ou = state.ui.selectedOuId;
      return state.users.filter(function (u) {
        if (u.status === "deleted") return false;
        if (ou && ou !== "ou_root") {
          const chain = ancestors(u.ouId).map(function (o) { return o.id; });
          if (u.ouId !== ou && chain.indexOf(ou) === -1) return false;
        }
        if (!q) return true;
        return (u.name + " " + u.email).toLowerCase().indexOf(q) !== -1;
      });
    }

    function labById(id) {
      return LABS.find(function (l) { return l.id === id; });
    }

    function labAckKey(labId, taskId) {
      return labId + ":" + taskId;
    }

    function labAcked(s, labId, taskId) {
      return !!(s.ui.labs && s.ui.labs.acks && s.ui.labs.acks[labAckKey(labId, taskId)]);
    }

    function markLabAck(labId, taskId) {
      if (!state.ui.labs.acks) state.ui.labs.acks = {};
      state.ui.labs.acks[labAckKey(labId, taskId)] = true;
      saveState();
      paintLabCoach();
    }

    function labTasksPassed(lab) {
      if (!lab) return [];
      return lab.tasks.map(function (t) {
        var ok = false;
        if (t.ack) ok = labAcked(state, lab.id, t.id);
        else {
          try { ok = !!t.check(state); } catch (e) { ok = false; }
        }
        return { id: t.id, doThis: t.doThis, ok: ok, ack: !!t.ack };
      });
    }

    function startLab(id) {
      var lab = labById(id);
      if (!lab) return;
      state.ui.walkthrough.active = false;
      state.ui.walkthrough.minimized = true;
      state.ui.labs.activeId = lab.id;
      state.ui.labs.startedAt = Date.now();
      state.ui.labs.minimized = false;
      if (typeof lab.prep === "function") {
        try { lab.prep(state); } catch (e) {}
      }
      state.ui.route = lab.startRoute || "labs";
      saveState();
      render();
      toast("Lab started — " + lab.code + " · " + lab.title);
    }

    function endLab(opts) {
      opts = opts || {};
      state.ui.labs.activeId = null;
      state.ui.labs.startedAt = null;
      state.ui.labs.minimized = false;
      if (!opts.keepRoute) state.ui.route = "labs";
      saveState();
      render();
      if (!opts.silent) toast("Lab ended. Tenant data stays until you reset.");
    }

    function completeActiveLab() {
      var lab = labById(state.ui.labs.activeId);
      if (!lab) return;
      var results = labTasksPassed(lab);
      if (results.some(function (r) { return !r.ok; })) {
        toast("Not yet — finish the remaining tasks.");
        paintLabCoach();
        return;
      }
      state.ui.labs.completed[lab.id] = Date.now();
      toast("Lab complete — " + lab.code);
      endLab({ keepRoute: true, silent: true });
      state.ui.route = "labs";
      saveState();
      render();
    }

    function panelLabs() {
      const wrap = el("div", { className: "panel active" });
      const hero = el("div", { className: "lab-hero" });
      hero.appendChild(el("p", { className: "chip blue", text: "Associate Google Workspace Administrator" }));
      hero.appendChild(el("h1", { text: "Practice labs by module" }));
      hero.appendChild(el("p", { className: "lede", text: "Every lab is a Northwind ticket mapped to a Study Desk section (0.1 Editions, 1.8 Groups, 3.4 Export…). Start it, read the quoted module fact, do the work in this practice tenant, then Check my work." }));
      const doneN = Object.keys(state.ui.labs.completed || {}).length;
      hero.appendChild(el("p", { className: "muted", text: doneN + " / " + LABS.length + " labs completed · every module 0–7 has scenarios that quote the desk." }));
      wrap.appendChild(hero);

      LAB_MODULES.forEach(function (mod) {
        const labs = LABS.filter(function (l) { return l.module === mod.id; });
        if (!labs.length) return;
        const h = el("h2", { className: "lab-mod-sec" });
        h.appendChild(document.createTextNode(mod.title));
        const a = el("a", { href: mod.href, text: "Open module →" });
        a.target = "_blank";
        a.rel = "noopener";
        h.appendChild(a);
        wrap.appendChild(h);
        const grid = el("div", { className: "lab-grid" });
        labs.forEach(function (lab) {
          const done = !!(state.ui.labs.completed && state.ui.labs.completed[lab.id]);
          const card = el("button", { type: "button", className: "lab-card" + (done ? " done" : "") });
          card.appendChild(el("div", { className: "lab-card-meta" }, [
            el("span", { className: "lab-id", text: lab.code }),
            el("span", { className: "badge", text: lab.minutes + " min" }),
            el("span", { className: "badge inherited", text: lab.domain })
          ]));
          card.appendChild(el("h3", { text: lab.title }));
          card.appendChild(el("div", { className: "lab-sec", text: (lab.sections || []).join(" · ") }));
          card.appendChild(el("p", { text: lab.scenario ? lab.scenario.ticket : "" }));
          card.appendChild(el("div", { className: "muted", text: (done ? "Completed · " : "") + (lab.scenario ? lab.scenario.constraint : "") }));
          card.addEventListener("click", function () { startLab(lab.id); });
          grid.appendChild(card);
        });
        wrap.appendChild(grid);
      });

      const tour = el("div", { className: "card" });

          onclick: () => {
            u.driveTransferred = true;
            state.offboard.step = Math.max(ob.step, 3);
            audit("Drive transferred", u.email);
            saveState(); render();
          }
        })
      ]));
      steps.appendChild(s2);

      // Step 3 wipe
      const s3 = el("li", { className: ob.step > 3 ? "done" : (ob.step < 3 ? "locked" : "") });
      s3.appendChild(el("strong", { text: "Mobile wipe (if needed)" }));
      const wipeRow = el("div", { className: "row" });
      wipeRow.appendChild(el("button", {
        type: "button", className: "btn", text: "Account wipe (BYOD)",
        disabled: ob.step < 3,
        onclick: () => {
          state.offboard.wipeChoice = "account";
          state.offboard.step = Math.max(ob.step, 4);
          audit("Account wipe", u.email);
          saveState(); render();
          toast("Corporate account wiped from BYOD — personal data left alone.");
        }
      }));
      wipeRow.appendChild(el("button", {
        type: "button", className: "btn", text: "Device wipe (company-owned)",
        disabled: ob.step < 3,
        onclick: () => {
          state.offboard.wipeChoice = "device";
          state.offboard.step = Math.max(ob.step, 4);
          audit("Device wipe", u.email);
          saveState(); render();
          toast("Full device wipe simulated.");
        }
      }));
      wipeRow.appendChild(el("button", {
        type: "button", className: "btn ghost", text: "Skip wipe",
        disabled: ob.step < 3,
        onclick: () => {
          state.offboard.step = Math.max(ob.step, 4);
          saveState(); render();
        }
      }));
      s3.appendChild(wipeRow);
      steps.appendChild(s3);

      // Step 4 end state
      const s4 = el("li", { className: ob.step < 4 ? "locked" : "" });
      s4.appendChild(el("strong", { text: "End state" }));
      s4.appendChild(document.createTextNode(" — Delete (reclaim license, 20-day restore) or Archived User License (keep data cheap for Vault)."));
      const endRow = el("div", { className: "row" });
      endRow.appendChild(el("button", {
        type: "button", className: "btn danger", text: "Delete user",
        disabled: ob.step < 4 || u.vaultHold || !u.driveTransferred,

          if (!u.driveTransferred) { toast("Transfer Drive first."); return; }
          u.status = "deleted";

          saveState(); render();
          toast("User deleted — recoverable ~20 days in a real tenant.");
        }
      }));
      endRow.appendChild(el("button", {
        type: "button", className: "btn primary", text: "Switch to Archived User License",
        disabled: ob.step < 4,
        onclick: () => {
          u.status = "archived";
          audit("User archived (AUL)", u.email);
          state.offboard.step = 5;

          toast("AUL applied — data retained without a full seat.");
        }
      }));
      s4.appendChild(endRow);
      if (!u.driveTransferred) {
        s4.appendChild(el("div", { className: "warn", text: "Delete stays disabled until My Drive is transferred." }));
      }
      if (u.vaultHold) {
        s4.appendChild(el("div", { className: "danger-box", text: "Delete blocked by active Vault hold." }));
      }
      steps.appendChild(s4);

      card.appendChild(steps);
      wrap.appendChild(card);
      return wrap;
    }



    /* ---------- Domains & Gmail mail setup ---------- */
    function domainById(id) {
      return (state.domains || []).find(function (d) { return d.id === id; });
    }
    function primaryDomain() {
      return (state.domains || []).find(function (d) { return d.type === "primary"; }) || state.domains[0];
    }
    function ensureDns(d) {
      if (!d.dns) {
        d.dns = {
          mx: [{ priority: 1, host: "@", value: "smtp.google.com", published: false }],
          spf: { published: false, value: "v=spf1 include:_spf.google.com ~all" },
          dkim: { generated: false, published: false, started: false, selector: "google", host: "google._domainkey", value: "" },
          dmarc: { published: false, policy: "none", host: "_dmarc", value: "" }
        };
      }
      return d.dns;
    }
    function mailHealth(d) {
      const dns = ensureDns(d);
      const mxOk = d.verified && d.gmailActivated && dns.mx.every(function (r) { return r.published; });
      const outOk = dns.spf.published && dns.dkim.started && dns.dmarc.published;
      return {
        inbound: !d.verified ? "unverified" : !d.gmailActivated ? "gmail-off" : mxOk ? "ok" : "mx-missing",
        outbound: !dns.spf.published && !dns.dkim.started ? "missing" : outOk ? "ok" : "partial",
        mxOk: mxOk,
        authOk: outOk
      };
    }
    function statusPill(kind, text) {
      return el("span", { className: "status-pill " + kind, text: text });
    }
    function copyCode(label, value) {
      const wrap = el("div");
      wrap.appendChild(el("div", { className: "muted", text: label }));
      const box = el("div", { className: "codebox", text: value });
      wrap.appendChild(box);
      wrap.appendChild(el("button", {
        type: "button", className: "btn", text: "Copy value",
        onclick: function () {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(value).then(function () { toast("Copied to clipboard."); }).catch(function () { toast(value); });
          } else toast(value);
        }
      }));
      return wrap;
    }

      const health = mailHealth(d);

      const healthCard = el("div", { className: "card" });
      healthCard.appendChild(el("h2", { text: "Mail health — " + d.name }));
      const hrow = el("div", { className: "row" });
      hrow.appendChild(document.createTextNode("Inbound: "));
      hrow.appendChild(statusPill(
        health.inbound === "ok" ? "ok" : health.inbound === "unverified" ? "bad" : "warn",
        health.inbound === "ok" ? "MX ready" : health.inbound === "unverified" ? "Domain not verified" : health.inbound === "gmail-off" ? "Gmail not activated" : "MX not published"
      ));
      hrow.appendChild(document.createTextNode("Outbound auth: "));
      hrow.appendChild(statusPill(
        health.outbound === "ok" ? "ok" : health.outbound === "partial" ? "warn" : "bad",
        health.outbound === "ok" ? "SPF+DKIM+DMARC OK" : health.outbound === "partial" ? "Incomplete trio" : "Not configured"
      ));
      healthCard.appendChild(hrow);
      wrap.appendChild(healthCard);

      // Tabs
      const tabs = el("div", { className: "tabs", role: "tablist" });
      [["setup", "Setup"], ["inbound", "Inbound (MX)"], ["outbound", "Outbound (SPF/DKIM/DMARC)"], ["test", "Test mail"], ["routing", "Routing tips"]].forEach(function (pair) {
        tabs.appendChild(el("button", {
          type: "button",
          className: "tab" + (state.ui.gmailTab === pair[0] ? " active" : ""),
          text: pair[1],
          onclick: function () { state.ui.gmailTab = pair[0]; saveState(); render(); }
        }));
      });
      wrap.appendChild(tabs);

      const tab = state.ui.gmailTab || "setup";

      if (tab === "setup") {
        const card = el("div", { className: "card" });
        card.appendChild(el("h2", { text: "Activate Gmail for this domain" }));
        const ul = el("ul", { className: "checklist" });
        ul.appendChild(el("li", null, [
          statusPill(d.verified ? "ok" : "warn", d.verified ? "Done" : "Todo"),
          document.createTextNode(" Verify domain ownership (Account > Domains)")
        ]));
        ul.appendChild(el("li", null, [
          statusPill(d.gmailActivated ? "ok" : "warn", d.gmailActivated ? "Done" : "Todo"),
          document.createTextNode(" Activate Gmail for the domain")
        ]));
        ul.appendChild(el("li", null, [
          statusPill(health.mxOk ? "ok" : "warn", health.mxOk ? "Done" : "Todo"),
          document.createTextNode(" Publish MX so inbound mail reaches Google")
        ]));
        ul.appendChild(el("li", null, [
          statusPill(health.authOk ? "ok" : "warn", health.authOk ? "Done" : "Todo"),
          document.createTextNode(" Complete SPF + DKIM + DMARC for outbound")
        ]));
        card.appendChild(ul);

        if (!d.verified) {
          card.appendChild(el("div", { className: "warn", text: "Domain is not verified yet. Finish TXT verification under Domains first." }));
          card.appendChild(el("button", {
            type: "button", className: "btn primary", text: "Go to Domains",
            onclick: function () { state.ui.route = "domains"; saveState(); render(); }
          }));
        } else if (!d.gmailActivated) {
          card.appendChild(el("button", {
            type: "button", className: "btn primary", text: "Activate Gmail",
            onclick: function () {
              d.gmailActivated = true;
              audit("Gmail activated", d.name);
              saveState(); render();
              toast("Gmail activated for " + d.name + ". Publish MX next.");
            }
          }));
        } else {
          card.appendChild(el("div", { className: "ok-box", text: "Gmail is activated. Continue with Inbound (MX) and Outbound authentication tabs." }));
        }
        wrap.appendChild(card);
        wrap.appendChild(tipBox("MX only directs inbound mail. Outbound spam at recipients is almost always an SPF/DKIM/DMARC gap.", "./index.html#m2"));
      }

      if (tab === "inbound") {
        const card = el("div", { className: "card" });
        card.appendChild(el("h2", { text: "MX records — inbound routing" }));
        card.appendChild(el("p", { text: "Modern Google setup uses a single MX: smtp.google.com (priority 1). Older setups used five ASPMX records." }));
        if (!d.verified || !d.gmailActivated) {
          card.appendChild(el("div", { className: "warn", text: "Verify the domain and activate Gmail before relying on MX delivery." }));
        }
        const table = el("table", { className: "dns-table" });
        const thr = el("tr");
        ["Type", "Host", "Priority", "Value", "Published"].forEach(function (h) { thr.appendChild(el("th", { text: h })); });
        table.appendChild(el("thead", null, [thr]));
        const tb = el("tbody");
        dns.mx.forEach(function (r) {
          const tr = el("tr");
          tr.appendChild(el("td", { text: "MX" }));
          tr.appendChild(el("td", { text: r.host }));
          tr.appendChild(el("td", { text: String(r.priority) }));
          tr.appendChild(el("td", { text: r.value }));
          tr.appendChild(el("td", { text: r.published ? "Yes" : "No" }));
          tb.appendChild(tr);
        });
        table.appendChild(tb);
        card.appendChild(table);
        const row = el("div", { className: "row" });
        row.appendChild(el("button", {
          type: "button", className: "btn primary", text: "Simulate: publish MX at DNS host",
          disabled: dns.mx.every(function (r) { return r.published; }),
          onclick: function () {
            dns.mx.forEach(function (r) { r.published = true; });
            audit("MX published", d.name);
            saveState(); render();
            toast("MX published — inbound mail can route to Google (simulated).");
          }
        }));
        row.appendChild(el("button", {
          type: "button", className: "btn", text: "Use legacy ASPMX set",
          onclick: function () {
            dns.mx = [
              { priority: 1, host: "@", value: "ASPMX.L.GOOGLE.COM", published: false },
              { priority: 5, host: "@", value: "ALT1.ASPMX.L.GOOGLE.COM", published: false },
              { priority: 5, host: "@", value: "ALT2.ASPMX.L.GOOGLE.COM", published: false },
              { priority: 10, host: "@", value: "ALT3.ASPMX.L.GOOGLE.COM", published: false },
              { priority: 10, host: "@", value: "ALT4.ASPMX.L.GOOGLE.COM", published: false }
            ];
            audit("MX switched to legacy ASPMX", d.name);
            saveState(); render();
          }
        }));
        row.appendChild(el("button", {
          type: "button", className: "btn", text: "Use modern smtp.google.com",
          onclick: function () {
            dns.mx = [{ priority: 1, host: "@", value: "smtp.google.com", published: false }];
            audit("MX switched to smtp.google.com", d.name);
            saveState(); render();
          }
        }));
        card.appendChild(row);
        card.appendChild(el("p", { className: "muted", text: "Also remove old MX records that still point elsewhere, or mail stays at the legacy host." }));
        wrap.appendChild(card);
      }

      if (tab === "outbound") {
        const card = el("div", { className: "card" });
        card.appendChild(el("h2", { text: "Authenticate email — SPF, DKIM, DMARC" }));
        card.appendChild(el("p", { text: "These three DNS records prove outbound mail is yours. Incomplete trio → recipients mark you as spam." }));

        // SPF
        const spf = el("div", { className: "card" });
        spf.appendChild(el("h2", { text: "1. SPF (allowed senders)" }));
        spf.appendChild(copyCode("TXT record", dns.spf.value));
        spf.appendChild(el("button", {
          type: "button", className: "btn" + (dns.spf.published ? "" : " primary"),
          text: dns.spf.published ? "SPF published ✓" : "Simulate: publish SPF TXT",
          disabled: !!dns.spf.published,
          onclick: function () {
            dns.spf.published = true;
            audit("SPF published", d.name);
            saveState(); render();
          }
        }));
        card.appendChild(spf);

        // DKIM
        const dkim = el("div", { className: "card" });
        dkim.appendChild(el("h2", { text: "2. DKIM (sign outbound mail)" }));
        dkim.appendChild(el("p", { className: "muted", text: "Admin path: Apps > Gmail > Authenticate email → Generate new record → publish TXT → Start authentication." }));
        if (!dns.dkim.generated) {
          dkim.appendChild(el("button", {
            type: "button", className: "btn primary", text: "Generate DKIM record (2048-bit)",
            onclick: function () {
              dns.dkim.generated = true;
              dns.dkim.selector = "google";
              dns.dkim.host = "google._domainkey";
              dns.dkim.value = "v=DKIM1; k=rsa; p=MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA" + Math.random().toString(36).slice(2, 18).toUpperCase();
              dns.dkim.published = false;
              dns.dkim.started = false;
              audit("DKIM generated", d.name);
              saveState(); render();
            }
          }));
        } else {
          dkim.appendChild(copyCode("TXT host", dns.dkim.host));
          dkim.appendChild(copyCode("TXT value", dns.dkim.value));
          const row = el("div", { className: "row" });
          row.appendChild(el("button", {
            type: "button", className: "btn" + (dns.dkim.published ? "" : " primary"),
            text: dns.dkim.published ? "DKIM TXT published ✓" : "Simulate: publish DKIM TXT",
            disabled: !!dns.dkim.published,
            onclick: function () {
              dns.dkim.published = true;
              audit("DKIM published", d.name);
              saveState(); render();
            }
          }));
          row.appendChild(el("button", {
            type: "button", className: "btn primary",
            text: dns.dkim.started ? "Authentication started ✓" : "Start authentication",
            disabled: !dns.dkim.published || !!dns.dkim.started,
            onclick: function () {
              if (!dns.dkim.published) { toast("Publish DKIM TXT first."); return; }
              dns.dkim.started = true;
              audit("DKIM authentication started", d.name);
              saveState(); render();
              toast("DKIM authentication started.");
            }
          }));
          dkim.appendChild(row);
        }
        card.appendChild(dkim);

        // DMARC
        const dmarc = el("div", { className: "card" });
        dmarc.appendChild(el("h2", { text: "3. DMARC (failure policy + reports)" }));
        dmarc.appendChild(el("p", { text: "Start at p=none (monitor), then quarantine, then reject." }));
        const pol = el("select");
        ["none", "quarantine", "reject"].forEach(function (p) {
          const o = el("option", { value: p, text: "p=" + p });
          if ((dns.dmarc.policy || "none") === p) o.selected = true;
          pol.appendChild(o);
        });
        pol.addEventListener("change", function () {
          dns.dmarc.policy = pol.value;
          dns.dmarc.value = "v=DMARC1; p=" + pol.value + "; rua=mailto:dmarc-reports@" + d.name;
          dns.dmarc.published = false;
          saveState(); render();
        });
        dmarc.appendChild(el("div", { className: "field" }, [el("label", { text: "Policy" }), pol]));
        if (!dns.dmarc.value) dns.dmarc.value = "v=DMARC1; p=" + (dns.dmarc.policy || "none") + "; rua=mailto:dmarc-reports@" + d.name;
        dmarc.appendChild(copyCode("TXT host", dns.dmarc.host || "_dmarc"));
        dmarc.appendChild(copyCode("TXT value", dns.dmarc.value));
        dmarc.appendChild(el("button", {
          type: "button", className: "btn" + (dns.dmarc.published ? "" : " primary"),
          text: dns.dmarc.published ? "DMARC published ✓" : "Simulate: publish DMARC TXT",
          disabled: !!dns.dmarc.published,
          onclick: function () {
            dns.dmarc.published = true;
            audit("DMARC published p=" + dns.dmarc.policy, d.name);
            saveState(); render();
          }
        }));
        card.appendChild(dmarc);
        wrap.appendChild(card);
        wrap.appendChild(tipBox("Outbound spam complaints → finish SPF + DKIM + DMARC, not a random Gmail toggle.", "./index.html#dns"));
      }

      if (tab === "test") {
        const card = el("div", { className: "card" });
        card.appendChild(el("h2", { text: "Test inbound / outbound (simulated)" }));
        card.appendChild(el("p", { className: "muted", text: "This does not send real email — it checks your sandbox DNS/Gmail state the way an exam scenario would reason." }));

        const inBtn = el("button", {
          type: "button", className: "btn primary", text: "Simulate inbound test message",
          onclick: function () {
            const h = mailHealth(d);
            let result, ok;
            if (!d.verified) { ok = false; result = "FAIL — domain not verified."; }
            else if (!d.gmailActivated) { ok = false; result = "FAIL — Gmail not activated for domain."; }
            else if (!h.mxOk) { ok = false; result = "FAIL — MX not published (or still pointing elsewhere)."; }
            else { ok = true; result = "DELIVERED — message accepted by Google MX for " + d.name + "."; }
            state.mailLab.lastInbound = { at: Date.now(), ok: ok, detail: result, domain: d.name };
            audit("Inbound mail test", result);
            saveState(); render();
            toast(ok ? "Inbound OK" : "Inbound failed — check MX/setup");
          }
        });
        const outBtn = el("button", {
          type: "button", className: "btn", text: "Simulate outbound to external recipient",
          onclick: function () {
            const dns2 = ensureDns(d);
            let result, ok;
            if (!dns2.spf.published || !dns2.dkim.started || !dns2.dmarc.published) {
              ok = false;
              result = "LANDED IN SPAM / UNTRUSTED — incomplete SPF/DKIM/DMARC trio.";
            } else {
              ok = true;
              result = "ACCEPTED — SPF pass, DKIM pass, DMARC aligned (p=" + dns2.dmarc.policy + ").";
            }
            state.mailLab.lastOutbound = { at: Date.now(), ok: ok, detail: result, domain: d.name };
            audit("Outbound mail test", result);
            saveState(); render();
            toast(ok ? "Outbound authenticated" : "Outbound looks spammy — finish auth trio");
          }
        });
        card.appendChild(el("div", { className: "row" }, [inBtn, outBtn]));

        if (state.mailLab.lastInbound) {
          const box = el("div", { className: state.mailLab.lastInbound.ok ? "ok-box" : "danger-box" });
          box.appendChild(el("strong", { text: "Last inbound: " }));
          box.appendChild(document.createTextNode(state.mailLab.lastInbound.detail));
          card.appendChild(box);
        }
        if (state.mailLab.lastOutbound) {
          const box = el("div", { className: state.mailLab.lastOutbound.ok ? "ok-box" : "danger-box" });
          box.appendChild(el("strong", { text: "Last outbound: " }));
          box.appendChild(document.createTextNode(state.mailLab.lastOutbound.detail));
          card.appendChild(box);
        }
        wrap.appendChild(card);
      }

      if (tab === "routing") {
        const card = el("div", { className: "card" });
        card.appendChild(el("h2", { text: "Routing & compliance (exam map)" }));
        card.appendChild(el("p", { text: "Full routing rule builders are stubbed here — know where they live and what they do:" }));
        const table = el("table", { className: "user-table" });
        const thr = el("tr");
        ["Need", "Where / tool"].forEach(function (h) { thr.appendChild(el("th", { text: h })); });
        table.appendChild(el("thead", null, [thr]));
        [
          ["Content / attachment compliance", "Apps > Gmail > Compliance / routing rules"],
          ["Dual or split delivery during migration", "Gmail routing"],
          ["Inbound/outbound gateway (third-party filter)", "Gmail Advanced settings > Gateways"],
          ["Disable POP/IMAP / forwarding (exfil control)", "Gmail user settings per OU"],
          ["Trace one message", "Email Log Search (Reporting) — last ~30 days"]
        ].forEach(function (row) {
          const tr = el("tr");
          tr.appendChild(el("td", { text: row[0] }));
          tr.appendChild(el("td", { text: row[1] }));
          table.appendChild(tr);
        });
        card.appendChild(table);
        wrap.appendChild(card);
        wrap.appendChild(tipBox("Migration of mailbox content uses Data Migration Service — not GCDS.", "./index.html#m2"));
      }

      return wrap;
    }

    // fix bad quote in m2-s4 if any - handled in string above carefully

    function currentStep() {
      const i = state.ui.walkthrough.stepIndex || 0;
      return WALKTHROUGH[Math.min(i, WALKTHROUGH.length - 1)];
    }

    function announceCoach(msg) {
      const live = document.getElementById("coachLive");
      if (live) live.textContent = msg;
    }

    function applyPrep(step) {
      if (step && typeof step.prep === "function") {
        try { step.prep(state); } catch (e) {}
      }
      if (step && step.route) state.ui.route = step.route;
    }

    function goStep(index, opts) {
      opts = opts || {};
      const wt = state.ui.walkthrough;
      wt.stepIndex = Math.max(0, Math.min(index, WALKTHROUGH.length - 1));
      if (!wt.startedAt) wt.startedAt = Date.now();
      const step = currentStep();
      applyPrep(step);
      saveState();
      render();
      if (!opts.silent) announceCoach("Module " + step.moduleTitle + ": " + step.title);
    }

    function markStepDone(id) {
      state.ui.walkthrough.completed[id] = true;
      const idx = WALKTHROUGH.findIndex(function (s) { return s.id === id; });
      if (idx === WALKTHROUGH.length - 1) {
        state.ui.walkthrough.finishedAt = Date.now();
        toast("Walkthrough complete — nice work.");
      }
      if (idx >= 0 && idx < WALKTHROUGH.length - 1) goStep(idx + 1);
      else { saveState(); renderCoachOnly(); }
    }

    function stepSatisfied(step) {
      if (!step) return false;
      if (state.ui.walkthrough.completed[step.id] || state.ui.walkthrough.skipped[step.id]) return true;
      if (typeof step.check === "function") {
        try { return !!step.check(state); } catch (e) { return false; }
      }
      return false;
    }

    function maybeAutoAdvance() {
      const wt = state.ui.walkthrough;
      if (!wt.active || wt.minimized) return;
      const step = currentStep();
      if (!step || step.requireMark) return;
      if (stepSatisfied(step) && !wt.completed[step.id]) {
        wt.completed[step.id] = true;
        const idx = WALKTHROUGH.findIndex(function (s) { return s.id === step.id; });
        if (idx >= 0 && idx < WALKTHROUGH.length - 1) {
          toast("Step complete — advancing.");
          goStep(idx + 1, { silent: true });
          announceCoach("Completed " + step.title);
        } else {
          wt.finishedAt = Date.now();
          saveState();
          renderCoachOnly();
          toast("Walkthrough complete — nice work.");
        }
      }
    }

    function setCoachOpen(open) {
      const wt = state.ui.walkthrough;
      wt.active = !!open;
      if (open) {
        wt.minimized = false;
        if (!wt.startedAt) wt.startedAt = Date.now();
        applyPrep(currentStep());
      }
      document.body.classList.toggle("coach-open", !!open && !wt.minimized);
      document.body.classList.toggle("coach-minimized", !!open && !!wt.minimized);
      const btn = document.getElementById("btnWalkthrough");
      if (btn) btn.setAttribute("aria-expanded", open && !wt.minimized ? "true" : "false");
      saveState();
      render();
      if (open && !wt.minimized) {
        const coach = document.getElementById("coach");
        if (coach) coach.focus();
      }
    }

    function labDockOpen() {
      return !!(state.ui.labs && state.ui.labs.activeId && !state.ui.labs.minimized);
    }
    function wtDockOpen() {
      return !!state.ui.walkthrough.active && !state.ui.walkthrough.minimized && !(state.ui.labs && state.ui.labs.activeId);
    }

    function paintLabLive() {
      const live = document.getElementById("labLive");
      const idEl = document.getElementById("labLiveId");
      const timeEl = document.getElementById("labLiveTime");
      const lab = labById(state.ui.labs && state.ui.labs.activeId);
      document.body.classList.toggle("lab-mode", !!lab);
      const banner = document.getElementById("labBanner");
      if (banner) {
        banner.innerHTML = "";
        const st = document.createElement("strong");
        if (lab) {
          st.textContent = "Lab in progress — " + lab.code;
          banner.appendChild(st);
          banner.appendChild(document.createTextNode(" · " + lab.title + " · practice tenant, not Google. "));
        } else {
          st.textContent = "Associate Admin Labs";
          banner.appendChild(st);
          banner.appendChild(document.createTextNode(" — a practice tenant for the Associate Google Workspace Administrator exam. Not Google, not a real Admin console. "));
        }
        const a = document.createElement("a");
        a.href = "./index.html";
        a.textContent = "Study Desk";
        banner.appendChild(a);
      }
      if (idEl) idEl.textContent = lab ? lab.code : "LAB";
      if (timeEl && lab && state.ui.labs.startedAt) {
        const sec = Math.max(0, Math.floor((Date.now() - state.ui.labs.startedAt) / 1000));
        const m = String(Math.floor(sec / 60)).padStart(2, "0");
        const r = String(sec % 60).padStart(2, "0");
        timeEl.textContent = m + ":" + r;
      }
    }

    function renderCoachOnly() {
      document.body.classList.toggle("coach-open", labDockOpen() || wtDockOpen());
      document.body.classList.toggle("coach-minimized", !!(state.ui.labs && state.ui.labs.activeId && state.ui.labs.minimized) || (!!state.ui.walkthrough.active && !!state.ui.walkthrough.minimized && !labDockOpen()));
      paintCoach();
      paintFab();
      paintLabLive();
    }

    function paintFab() {
      const fab = document.getElementById("coachFab");
      if (!fab) return;
      clear(fab);
      if (state.ui.labs && state.ui.labs.activeId) {
        const lab = labById(state.ui.labs.activeId);
        fab.appendChild(document.createTextNode("Lab brief · " + (lab ? lab.code : "LAB")));
        return;
      }
      const wt = state.ui.walkthrough;
      const step = currentStep();
      fab.appendChild(document.createTextNode("Tour · " + (step ? step.module.toUpperCase() : "?") + " · " + ((wt.stepIndex || 0) + 1) + "/" + WALKTHROUGH.length));
    }

    function paintLabCoach() {
      const coach = document.getElementById("coach");
      if (!coach) return;
      clear(coach);
      const lab = labById(state.ui.labs.activeId);
      if (!lab) return;
      const results = labTasksPassed(lab);
      const passN = results.filter(function (r) { return r.ok; }).length;
      coach.appendChild(el("h2", { text: "Lab brief" }));
      coach.appendChild(el("div", { className: "lab-id", text: lab.code + " · " + lab.minutes + " min · " + lab.domain }));
      coach.appendChild(el("div", { className: "coach-title", text: lab.title }));
      if (lab.desk) {
        const link = el("a", { href: lab.desk, text: "Jump to this section on the Study Desk →" });
        link.target = "_blank";
        link.rel = "noopener";
        link.style.display = "inline-block";
        link.style.margin = ".15rem 0 .45rem";
        link.style.fontSize = ".82rem";
        coach.appendChild(link);
      }
      if (lab.reads && lab.reads.length) {
        const reads = el("div", { className: "lab-reads" });
        lab.reads.forEach(function (r) {
          const a = el("a", { href: r.href, text: r.label });
          a.target = "_blank";
          a.rel = "noopener";
          reads.appendChild(a);
        });
        coach.appendChild(reads);
      }
      if (lab.fromDesk) {
        const quote = el("div", { className: "lab-from-desk" });
        quote.appendChild(el("em", { text: "From the Study Desk" }));
        quote.appendChild(document.createTextNode(lab.fromDesk));
        coach.appendChild(quote);
      }
      if (lab.scenario) {
        const sc = el("div", { className: "lab-scenario" });
        sc.appendChild(el("strong", { text: "Scenario · Who" }));
        sc.appendChild(document.createTextNode(lab.scenario.who));
        sc.appendChild(el("strong", { text: "Ticket" }));
        sc.appendChild(document.createTextNode(lab.scenario.ticket));
        sc.appendChild(el("strong", { text: "Constraint (exam)" }));
        sc.appendChild(document.createTextNode(lab.scenario.constraint));
        coach.appendChild(sc);
      }
      if (lab.objectives && lab.objectives.length) {
        const ul = el("ul", { className: "lab-obj" });
        lab.objectives.forEach(function (o) { ul.appendChild(el("li", { text: o })); });
        coach.appendChild(ul);
      }
      if (lab.sections && lab.sections.length) {
        coach.appendChild(el("p", { className: "coach-meta", text: "Covers: " + lab.sections.join(" · ") }));
      }
      const bar = el("div", { className: "coach-progress" });
      const fill = document.createElement("i");
      fill.style.width = Math.round((passN / Math.max(1, results.length)) * 100) + "%";
      bar.appendChild(fill);
      coach.appendChild(bar);
      coach.appendChild(el("div", { className: "coach-meta", text: passN + " / " + results.length + " tasks passing" }));
      results.forEach(function (r) {
        const row = el("div", { className: "lab-task " + (r.ok ? "pass" : "fail") });
        row.appendChild(el("span", { className: "mark" }));
        const body = el("div", { className: "lab-task-body" });
        body.appendChild(document.createTextNode(r.doThis));
        if (r.ack && !r.ok) {
          body.appendChild(el("button", {
            type: "button",
            className: "btn",
            text: "I mapped this to the module",
            onclick: function () { markLabAck(lab.id, r.id); }
          }));
        }
        row.appendChild(body);
        coach.appendChild(row);
      });
      const actions = el("div", { className: "coach-actions" });
      actions.appendChild(el("button", { type: "button", className: "btn primary", text: "Check my work", onclick: function () {
        const now = labTasksPassed(lab);
        if (now.every(function (t) { return t.ok; })) completeActiveLab();
        else {
          toast((now.filter(function (t) { return t.ok; }).length) + " / " + now.length + " tasks done — keep going.");
          paintLabCoach();
        }
      } }));
      actions.appendChild(el("button", { type: "button", className: "btn", text: "Minimize brief", onclick: function () {
        state.ui.labs.minimized = true;
        saveState();
        renderCoachOnly();
      } }));
      actions.appendChild(el("button", { type: "button", className: "btn ghost", text: "End lab", onclick: function () { endLab(); } }));
      coach.appendChild(actions);
      coach.appendChild(el("p", { className: "coach-why", text: lab.why || "Exam habit: read the constraint, pick the narrowest correct tool, then act in the tenant." }));
    }

    function paintCoach() {
      const coach = document.getElementById("coach");
      if (!coach) return;
      if (state.ui.labs && state.ui.labs.activeId && !state.ui.labs.minimized) {
        paintLabCoach();
        return;
      }
      clear(coach);
      const wt = state.ui.walkthrough;
      if (!wt.active || wt.minimized) return;

      const step = currentStep();
      const doneCount = Object.keys(wt.completed).length;
      const pct = Math.round(((wt.stepIndex + 1) / WALKTHROUGH.length) * 100);

      coach.appendChild(el("h2", { text: "Trainer walkthrough" }));
      coach.appendChild(el("div", { className: "coach-meta", text: "Step " + (wt.stepIndex + 1) + " / " + WALKTHROUGH.length + " · " + doneCount + " marked done" }));
      const bar = el("div", { className: "coach-progress" });
      const fill = document.createElement("i");
      fill.style.width = pct + "%";
      bar.appendChild(fill);
      coach.appendChild(bar);

      const modPick = el("div", { className: "field" });
      modPick.appendChild(el("label", { text: "Jump to module", for: "coachModule" }));
      const sel = el("select", { id: "coachModule" });
      const mods = [];
      WALKTHROUGH.forEach(function (s) {
        if (mods.indexOf(s.module) === -1) mods.push(s.module);
      });
      mods.forEach(function (m) {
        const first = WALKTHROUGH.find(function (s) { return s.module === m; });
        const o = el("option", { value: m, text: m.toUpperCase() + " · " + first.moduleTitle });
        if (step.module === m) o.selected = true;
        sel.appendChild(o);
      });
      sel.addEventListener("change", function () {
        const idx = WALKTHROUGH.findIndex(function (s) { return s.module === sel.value; });
        if (idx >= 0) goStep(idx);
      });
      modPick.appendChild(sel);
      coach.appendChild(modPick);

      coach.appendChild(el("div", { className: "chip blue", text: "Module " + step.module.toUpperCase() + " · " + step.moduleTitle }));
      coach.appendChild(el("div", { className: "coach-title", text: step.title }));
      coach.appendChild(el("p", { className: "coach-body", text: step.body }));

      const doBox = el("div", { className: "coach-do" });
      doBox.appendChild(el("strong", { text: "Do this in the sandbox" }));
      doBox.appendChild(document.createTextNode(step.doThis));
      coach.appendChild(doBox);

      if (step.why) coach.appendChild(el("p", { className: "coach-why", text: "Exam: " + step.why }));

      if (step.desk) {
        const a = el("a", { href: step.desk, text: "Optional deep dive on Study Desk →" });
        coach.appendChild(a);
      }

      const satisfied = stepSatisfied(step);
      if (satisfied && !step.requireMark) {
        coach.appendChild(el("div", { className: "ok-box", text: "Looks complete — click Next or it may auto-advance." }));
      }

      const actions = el("div", { className: "coach-actions" });
      actions.appendChild(el("button", {
        type: "button", className: "btn", text: "Back",
        disabled: wt.stepIndex <= 0,
        onclick: function () { goStep(wt.stepIndex - 1); }
      }));
      actions.appendChild(el("button", {
        type: "button", className: "btn primary", text: step.requireMark ? "Mark done / Next" : "Next",
        onclick: function () {
          if (step.requireMark || stepSatisfied(step)) markStepDone(step.id);
          else toast("Finish the Do this action, or Skip if stuck.");
        }
      }));
      actions.appendChild(el("button", {
        type: "button", className: "btn ghost", text: "Skip",
        onclick: function () {
          wt.skipped[step.id] = true;
          const idx = wt.stepIndex;
          if (idx < WALKTHROUGH.length - 1) goStep(idx + 1);
          else { saveState(); renderCoachOnly(); }
        }
      }));
      actions.appendChild(el("button", {
        type: "button", className: "btn ghost", text: "Minimize",
        onclick: function () {
          wt.minimized = true;
          saveState();
          renderCoachOnly();
        }
      }));
      actions.appendChild(el("button", {
        type: "button", className: "btn ghost", text: "Exit tour",
        onclick: function () { setCoachOpen(false); }
      }));
      actions.appendChild(el("button", {
        type: "button", className: "btn danger", text: "Reset tour",
        onclick: function () {
          if (!confirm("Reset walkthrough progress only? Sandbox data stays.")) return;
          const wasActive = wt.active;
          state.ui.walkthrough = defaultWalkthrough();
          state.ui.walkthrough.active = wasActive;
          saveState();
          goStep(0);
          toast("Tour progress reset.");
        }
      }));
      coach.appendChild(actions);
    }

      document.getElementById("editionSelect").value = state.tenant.edition === "enterprise" ? "enterprise" : "business_plus";
      var prim = (state.domains || []).find(function (d) { return d.type === "primary"; }) || (state.domains || [])[0];
      if (prim) state.tenant.domain = prim.name;
      document.getElementById("tenantChip").textContent = state.tenant.domain;
      renderNav();
      const main = document.getElementById("main");
      clear(main);
      NAV_TREE.forEach(function (g) {
        if (g.kids && g.kids.indexOf(state.ui.route) >= 0) state.ui.navOpen[g.id] = true;
      });
      const route = ROUTES.find((r) => r.id === state.ui.route) || ROUTES[0];
      let panel;
      switch (route.id) {
        case "home": panel = panelHome(); break;
        case "ous": panel = panelOUs(); break;
        case "users": panel = panelUsers(); break;
        case "groups": panel = panelGroups(); break;
        case "drive": panel = panelDrive(); break;
        case "gmail": panel = panelGmail(); break;
        case "domains": panel = panelDomains(); break;
        case "dlp": panel = panelDlp(); break;
        case "mobile": panel = panelMobile(); break;
        case "storage": panel = panelStorage(); break;
        case "reporting": panel = panelReporting(); break;
        case "labs": panel = panelLabs(); break;
        case "scenarios": panel = panelScenarios(); break;
        case "gcds": panel = panelGcds(); break;
        case "vault": panel = panelVault(); break;
        case "offboard": panel = panelOffboard(); break;
        default: panel = stubPanel(route); break;
      }
      if (route.id !== "home" && route.id !== "users" && !panel.querySelector(".crumbs")) {
        panel.insertBefore(crumbBar(route), panel.firstChild);
      }
      main.appendChild(panel);
      // Track OU visits for walkthrough
      if (state.ui.route === "ous") {
        state.ui.walkthrough._ousVisited = (state.ui.walkthrough._ousVisited || 0);
        // count unique selections via selectedOuId changes tracked lightly
      }
      paintCoach();
      paintFab();
      paintLabLive();
      document.body.classList.toggle("coach-open", labDockOpen() || wtDockOpen());
      document.body.classList.toggle("coach-minimized", !!(state.ui.labs && state.ui.labs.activeId && state.ui.labs.minimized) || (!!state.ui.walkthrough.active && !!state.ui.walkthrough.minimized && !labDockOpen()));
      maybeAutoAdvance();
    }

    function searchHits(q) {
      q = (q || "").trim().toLowerCase();
      if (!q) return [];
      const chip = state.ui.searchChip || "all";
      const out = [];
      if (chip === "all" || chip === "Users") {
        state.users.forEach(function (u) {
          if (u.status === "deleted") return;
          if ((u.name + " " + u.email).toLowerCase().indexOf(q) >= 0) {
            out.push({ kind: "Users", label: u.name, sub: u.email, go: function () { go("users", { selectedUserId: u.id, userDetail: true }); } });
          }
        });
      }
      if (chip === "all" || chip === "Settings" || chip === "Features") {
        SEARCH_ALIASES.forEach(function (a) {
          if (a.q.indexOf(q) >= 0 || q.indexOf(a.q) >= 0) {
            if (chip !== "all" && a.kind !== chip) return;
            out.push({ kind: a.kind, label: a.label, sub: "Admin console → " + a.id, go: function () { go(a.id); } });
          }
        });
        ROUTES.forEach(function (r) {
          if ((r.label + " " + (r.sec || "")).toLowerCase().indexOf(q) >= 0) {
            out.push({ kind: "Features", label: r.label, sub: (r.crumb || []).join(" > "), go: function () { go(r.id); } });
          }
        });
      }
      const seen = {};
      return out.filter(function (h) {
        const k = h.kind + h.label;
        if (seen[k]) return false;
        seen[k] = true;
        return true;
      }).slice(0, 12);
    }

    function paintSearchPop() {
      const pop = document.getElementById("searchPop");
      const box = document.getElementById("adminSearch");
      if (!pop || !box) return;
      const q = box.value;
      clear(pop);
      if (!q.trim()) { pop.classList.remove("open"); return; }
      const chips = el("div", { className: "search-chip-row" });
      ["all", "Users", "Settings", "Features"].forEach(function (c) {
        chips.appendChild(el("button", {
          type: "button",
          className: "search-chip" + ((state.ui.searchChip || "all") === c ? " on" : ""),
          text: c === "all" ? "All" : c,
          onclick: function () { state.ui.searchChip = c; paintSearchPop(); }
        }));
      });
      pop.appendChild(chips);
      const hits = searchHits(q);
      if (!hits.length) pop.appendChild(el("p", { className: "muted", text: "No matches in this practice tenant." }));
      hits.forEach(function (h) {
        const b = el("button", { type: "button", className: "search-hit", onclick: function () {
          pop.classList.remove("open");
          box.blur();
          h.go();
        } });
        const col = el("div");
        col.appendChild(document.createTextNode(h.label));
        col.appendChild(el("small", { text: h.kind + " · " + h.sub }));
        b.appendChild(col);
        pop.appendChild(b);
      });
      pop.classList.add("open");
    }

    document.getElementById("btnMenu").addEventListener("click", function () {
      state.ui.navCollapsed = !state.ui.navCollapsed;
      saveState();
      renderNav();
    });
    document.getElementById("btnAvatar").addEventListener("click", function () {
      document.getElementById("acctMenu").classList.toggle("open");
    });
    document.getElementById("btnHelp").addEventListener("click", function () {
      toast("In a real console this opens Help. Here: search DKIM, Ada, wipe, or Vault.");
    });
    document.addEventListener("click", function (e) {
      const pop = document.getElementById("searchPop");
      const wrap = e.target.closest && e.target.closest(".admin-search-wrap");
      if (pop && !wrap) pop.classList.remove("open");
      const menu = document.getElementById("acctMenu");
      if (menu && !e.target.closest("#acctMenu") && !e.target.closest("#btnAvatar")) menu.classList.remove("open");
    });
    document.getElementById("adminSearch").addEventListener("input", paintSearchPop);
    document.getElementById("adminSearch").addEventListener("focus", paintSearchPop);
    document.getElementById("adminSearch").addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        const hits = searchHits(e.target.value);
        if (hits[0]) { document.getElementById("searchPop").classList.remove("open"); hits[0].go(); }
      }
    });

    document.getElementById("editionSelect").addEventListener("change", (e) => {
      state.tenant.edition = e.target.value === "enterprise" ? "enterprise" : "business_plus";
      state.ui.walkthrough._editionTouched = true;
      audit("Edition changed", state.tenant.edition);
      saveState(); render();
    });

    document.getElementById("btnWalkthrough").addEventListener("click", () => {
      if (state.ui.labs && state.ui.labs.activeId) {
        endLab({ silent: true, keepRoute: true });
      }
      const wt = state.ui.walkthrough;
      if (wt.active && !wt.minimized) setCoachOpen(false);
      else setCoachOpen(true);
    });
    document.getElementById("btnLabs").addEventListener("click", () => {
      state.ui.route = "labs";
      saveState();
      render();
    });
    document.getElementById("btnEndLab").addEventListener("click", () => endLab());
    document.getElementById("coachFab").addEventListener("click", () => {
      if (state.ui.labs && state.ui.labs.activeId) {
        state.ui.labs.minimized = false;
        saveState();
        renderCoachOnly();
        return;
      }
      state.ui.walkthrough.minimized = false;
      setCoachOpen(true);
    });
    document.addEventListener("keydown", (e) => {
      if (e.key !== "Escape") return;
      const tag = (document.activeElement && document.activeElement.tagName || "").toLowerCase();
      if (tag === "input" || tag === "textarea" || tag === "select") return;
      if (state.ui.labs && state.ui.labs.activeId && !state.ui.labs.minimized) {
        state.ui.labs.minimized = true;
        saveState();
        renderCoachOnly();
        return;
      }
      if (state.ui.walkthrough.active && !state.ui.walkthrough.minimized) {
        state.ui.walkthrough.minimized = true;
        saveState();
        renderCoachOnly();
      }
    });

    document.getElementById("btnReset").addEventListener("click", () => {
      if (!confirm("Reset sandbox to seed data? Walkthrough progress is kept unless you also reset the tour.")) return;
      const keepTour = state.ui.walkthrough;
      state = seedState();
      state.ui.walkthrough = keepTour; // preserve tour progress across sandbox reset
      saveState();
      render();
      toast("Sandbox reset (tour progress kept).");
    });

    // Hash / query: #labs #ous ?wt=1 ?lab=lab-ou
    if (location.hash) {
      const id = location.hash.slice(1);
      if (id === "walkthrough" || id === "wt") {
        state.ui.walkthrough.active = true;
        state.ui.walkthrough.minimized = false;
      } else if (id === "labs") {
        state.ui.route = "labs";
      } else if (id === "home") {
        state.ui.route = "home";
      } else if (ROUTES.some((r) => r.id === id)) state.ui.route = id;
    } else if (!state.ui.labs.activeId && state.ui.route === "labs") {
      state.ui.route = "home";
    }
    if (/[?&]wt=1/.test(location.search)) {
      state.ui.walkthrough.active = true;
      state.ui.walkthrough.minimized = false;
    }
    const labMatch = location.search.match(/[?&]lab=([a-z0-9-]+)/i);
    if (labMatch && labById(labMatch[1])) {
      startLab(labMatch[1]);
    }

    setInterval(function () {
      if (state.ui.labs && state.ui.labs.activeId) paintLabLive();
    }, 1000);

    let lastOu = state.ui.selectedOuId;
    setInterval(function () {
      if (state.ui.selectedOuId !== lastOu) {
        lastOu = state.ui.selectedOuId;
        if (state.ui.route === "ous") {
          state.ui.walkthrough._ousVisited = (state.ui.walkthrough._ousVisited || 0) + 1;
        }
      }
    }, 400);

    render();
  })();
  </script>
</body>
</html>
